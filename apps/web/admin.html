<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="color-scheme" content="dark" />
  <title>AI AURA — Research</title>
  <style>
    :root { --bg:#0a0b0f; --elev:#14161d; --elev2:#1b1e28; --line:#262a36; --text:#eef1f7; --dim:#99a1b3; --faint:#626a7d; --buy:#16c784; --sell:#ea3943; --accent:#7c5cff; }
    * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
    body { margin:0; background:var(--bg); color:var(--text); font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; -webkit-font-smoothing:antialiased; padding:20px calc(16px + env(safe-area-inset-left)) calc(24px + env(safe-area-inset-bottom)); max-width:760px; margin:0 auto; }
    h1 { font-size:18px; letter-spacing:.1em; display:flex; align-items:center; gap:8px; }
    h1 .m { background:linear-gradient(135deg,var(--accent),#22d3ee); -webkit-background-clip:text; background-clip:text; color:transparent; }
    a.back { color:var(--dim); text-decoration:none; font-size:14px; }
    .card { background:var(--elev); border:1px solid var(--line); border-radius:16px; padding:18px; margin:14px 0; }
    .card h2 { margin:0 0 12px; font-size:13px; text-transform:uppercase; letter-spacing:.08em; color:var(--dim); }
    .row { display:grid; grid-template-columns:repeat(auto-fit,minmax(90px,1fr)); gap:12px; text-align:center; }
    .kpi .v { font-size:26px; font-weight:800; }
    .kpi .k { font-size:11px; color:var(--faint); text-transform:uppercase; letter-spacing:.05em; margin-top:2px; }
    table { width:100%; border-collapse:collapse; font-size:14px; }
    th,td { text-align:left; padding:8px 6px; border-bottom:1px solid var(--line); }
    th { color:var(--dim); font-weight:600; font-size:12px; text-transform:uppercase; }
    .pill { display:inline-block; padding:3px 10px; border-radius:999px; font-size:12px; font-weight:700; }
    .pill.ok { background:rgba(22,199,132,.15); color:var(--buy); }
    .pill.warn { background:rgba(245,166,35,.15); color:#f5c877; }
    .pill.bad { background:rgba(234,57,67,.15); color:var(--sell); }
    .muted { color:var(--faint); font-size:12px; line-height:1.5; }
    pre { background:var(--elev2); border:1px solid var(--line); border-radius:10px; padding:12px; overflow:auto; font-size:12px; color:var(--dim); }
    .win { color:var(--buy); } .loss { color:var(--sell); }
  </style>
</head>
<body>
  <h1><span class="m">◈</span> AI AURA — Research &nbsp; <a class="back" href="/">← app</a></h1>
  <p id="err" class="muted"></p>

  <div class="card">
    <h2>Performance (settled outcomes only)</h2>
    <div class="row">
      <div class="kpi"><div class="v" id="kTotal">—</div><div class="k">signals</div></div>
      <div class="kpi"><div class="v win" id="kWin">—</div><div class="k">wins</div></div>
      <div class="kpi"><div class="v loss" id="kLoss">—</div><div class="k">losses</div></div>
      <div class="kpi"><div class="v" id="kPending">—</div><div class="k">pending</div></div>
      <div class="kpi"><div class="v" id="kRate">—</div><div class="k">win rate</div></div>
      <div class="kpi"><div class="v" id="kStreak">—</div><div class="k">max loss streak</div></div>
    </div>
    <p class="muted" id="disc" style="margin-top:12px"></p>
  </div>

  <div class="card">
    <h2>Model</h2>
    <p>Active: <span class="pill" id="mActive">—</span> <span id="mDrift"></span></p>
    <div id="mMetrics"></div>
    <p class="muted" id="mNote"></p>
  </div>

  <div class="card">
    <h2>By asset</h2>
    <table id="byAsset"><thead><tr><th>Asset</th><th>Wins</th><th>Losses</th><th>Pending</th></tr></thead><tbody></tbody></table>
  </div>

  <div class="card">
    <h2>By expiry</h2>
    <table id="byExpiry"><thead><tr><th>Expiry</th><th>Wins</th><th>Losses</th></tr></thead><tbody></tbody></table>
  </div>

  <div class="card">
    <h2>Data health</h2>
    <p class="muted" id="health">—</p>
  </div>

  <script>
    const $ = (id) => document.getElementById(id);
    function cfg(k){ try{return localStorage.getItem(k)||"";}catch{return "";} }
    const base = cfg("aiaura_base"), token = cfg("aiaura_token");
    const api = (p) => fetch((base?base.replace(/\/$/,''):"")+p, { headers: token?{Authorization:"Bearer "+token}:{} })
      .then(async r => { const b = await r.json().catch(()=>({})); if(!r.ok) throw new Error(b.detail||r.status); return b; });

    function rows(tbodySel, data, cells){
      const tb = document.querySelector(tbodySel+" tbody"); tb.innerHTML="";
      (data||[]).forEach(d => { const tr=document.createElement("tr");
        tr.innerHTML = cells(d).map(c=>`<td>${c}</td>`).join(""); tb.appendChild(tr); });
    }

    async function load(){
      try {
        const s = await api("/api/stats");
        $("kTotal").textContent=s.total; $("kWin").textContent=s.wins; $("kLoss").textContent=s.losses;
        $("kPending").textContent=s.pending; $("kStreak").textContent=s.max_losing_streak;
        $("kRate").textContent = s.win_rate!=null ? Math.round(s.win_rate*100)+"%" : "—";
        $("disc").textContent = s.disclaimer;
        rows("#byAsset", s.by_asset, d=>[d.asset.replace("_otc"," OTC"), d.wins||0, d.losses||0, d.pending||0]);
        rows("#byExpiry", s.by_expiry, d=>[d.expiry_s<60?d.expiry_s+"s":(d.expiry_s/60)+"m", d.wins||0, d.losses||0]);
      } catch(e){ $("err").textContent = "Stats unavailable — "+e.message+" (set server/token in the app ⚙)."; }

      try {
        const m = await api("/api/model");
        $("mActive").textContent = m.active_model + (m.using_ml?" (ML)":" (baseline)");
        $("mActive").className = "pill " + (m.using_ml?"ok":"warn");
        $("mNote").textContent = m.note;
        if (m.drift){ const d=m.drift; const cls = d.status==="drift"?"bad":(d.status==="ok"?"ok":"warn");
          $("mDrift").innerHTML = `<span class="pill ${cls}">drift: ${d.status}</span>`; }
        if (m.champion && m.champion.metrics){ $("mMetrics").innerHTML = "<pre>"+JSON.stringify(m.champion.metrics,null,2)+"</pre>"; }
      } catch(e){ $("mNote").textContent = "Model info unavailable — "+e.message; }

      try {
        const h = await api("/api/health");
        $("health").textContent = `connection ${h.status||"?"} · ${h.ticks_received||0} ticks received · store ${h.store||"?"} · reconnects ${h.reconnects||0}`;
      } catch(e){ $("health").textContent = "—"; }
    }
    load();
  </script>
</body>
</html>
